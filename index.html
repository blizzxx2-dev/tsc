<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suture &amp; Steel</title>
    <style>
      html, body { margin: 0; height: 100%; background: #070505; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { display: block; cursor: none; touch-action: none; }
      #fatal { color: #e8dcc0; font: 18px Georgia, serif; max-width: 640px; padding: 24px; line-height: 1.5; }
      #boot, #lamps { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #070505; color: #d8c8a0; font: italic 20px Georgia, 'Palatino Linotype', serif; transition: opacity 0.35s; z-index: 2; }
      #lamps { background: rgba(7, 5, 5, 0.86); display: none; }
      #boot .t { font: 44px Georgia, serif; letter-spacing: 0.06em; color: #e8dcc0; }
      #boot .track { width: min(360px, 70vw); height: 3px; background: #2a1e14; }
      #boot-bar { width: 0; height: 100%; background: #c8a050; transition: width 0.2s; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot"><div class="t">Suture &amp; Steel</div><div class="track"><div id="boot-bar"></div></div><div id="boot-label">Lighting the lamps…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
