<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Georgia, serif" font-size="13">
  <title>Kessendorf and environs — writers' sketch (NAR-0009)</title>
  <rect width="960" height="640" fill="#efe3c6"/>
  <!-- Grauwald and barrow-fields (east) -->
  <g fill="#7d8a5f" opacity="0.55">
    <circle cx="760" cy="150" r="60"/><circle cx="820" cy="210" r="70"/><circle cx="880" cy="140" r="55"/><circle cx="700" cy="230" r="45"/>
  </g>
  <text x="760" y="120" font-style="italic" fill="#2b2a1d">the Grauwald</text>
  <text x="780" y="230" font-size="11" fill="#2b2a1d">old web-trees</text>
  <g fill="none" stroke="#5a4a32">
    <ellipse cx="870" cy="330" rx="14" ry="8"/><ellipse cx="900" cy="350" rx="12" ry="7"/><ellipse cx="850" cy="360" rx="10" ry="6"/>
  </g>
  <text x="820" y="390" fill="#2b2a1d">barrow-fields</text>
  <!-- Timber Road -->
  <path d="M470 300 C560 290 620 280 700 300 S 820 290 950 300" fill="none" stroke="#7a5a30" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="560" y="283" fill="#2b2a1d">the Timber Road (east, to the Vennmark)</text>
  <path d="M700 300 l -8 18 l 16 0 z" fill="#8a2020"/>
  <text x="640" y="336" font-size="11" fill="#2b2a1d">Watch muster camp (Ch2)</text>
  <!-- River Kessen -->
  <path d="M0 470 C160 430 260 480 360 440 S 520 390 600 440 S 800 520 960 480" fill="none" stroke="#5f7f94" stroke-width="18" opacity="0.8"/>
  <text x="120" y="500" font-style="italic" fill="#243c4a">the Kessen</text>
  <!-- City wall -->
  <polygon points="200,220 470,190 520,300 480,420 240,440 170,330" fill="#e2d2ad" stroke="#3a2e1e" stroke-width="4"/>
  <text x="250" y="178" font-size="18" fill="#3a2e1e">KESSENDORF (the Free City)</text>
  <!-- Districts -->
  <circle cx="330" cy="290" r="10" fill="#6a5a8a"/><text x="345" y="294">Cathedral Close · Tribunal court</text>
  <rect x="300" y="330" width="16" height="12" fill="#6a4a2a"/><text x="322" y="341">Guildhall Square · Barber-Surgeons' Guildhall</text>
  <rect x="455" y="285" width="14" height="14" fill="#fff" stroke="#8a2020" stroke-width="2"/>
  <text x="380" y="270" fill="#8a2020">Hospice of Saint Ildra</text>
  <path d="M470 292 l 30 0" stroke="#3a2e1e" stroke-width="3"/><text x="480" y="318" font-size="11">east gate · pyres</text>
  <g fill="#8a2020" opacity="0.7"><circle cx="512" cy="330" r="4"/><circle cx="522" cy="336" r="4"/></g>
  <rect x="200" y="360" width="60" height="30" fill="#9a7a4a" opacity="0.6"/><text x="186" y="405" font-size="11">Tanners' Rows</text>
  <rect x="250" y="235" width="44" height="24" fill="#4a4a4a" opacity="0.5"/><text x="210" y="228" font-size="11">gunsmiths' quarter</text>
  <text x="398" y="360" font-size="11">Crooked Goose (tavern)</text><circle cx="392" cy="356" r="4" fill="#3a2e1e"/>
  <text x="330" y="400" font-size="11">Wick Lane (chandlers)</text>
  <text x="390" y="425" font-size="11">Penny Stair</text>
  <!-- Bridges and Kilnrows -->
  <path d="M300 438 l 0 46" stroke="#3a2e1e" stroke-width="6"/><text x="306" y="470" font-size="11">Iron Bridge</text>
  <path d="M420 425 l 0 40" stroke="#6a4a2a" stroke-width="4"/><path d="M200 445 l 0 44" stroke="#6a4a2a" stroke-width="4"/>
  <rect x="190" y="505" width="250" height="80" fill="#6a6660" opacity="0.45"/>
  <text x="230" y="535" font-size="15" fill="#2b2a1d">the Kilnrows (Ch3)</text>
  <text x="210" y="560" font-size="11">bell-pits · foundries · powder-mill, Saltpetre Lane · Hall of Records ferry</text>
  <!-- Weissburg -->
  <text x="20" y="80" fill="#2b2a1d">← to Weissburg (west, eight days)</text>
  <!-- Compass -->
  <g transform="translate(900,580)"><path d="M0 -26 L6 0 L0 26 L-6 0 Z" fill="#3a2e1e"/><text x="-4" y="-32">N</text></g>
  <text x="20" y="620" font-size="11" fill="#5a4a32">Writers' sketch, not to scale. Canon for relative positions only; art maps (ART) may redraw.</text>
</svg>
