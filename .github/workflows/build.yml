# Build matrix (PLT-0140, PLT-0034–0038, PLT-0032, PLT-0123/0124 symbols, PLT-0150 retention).
# Produces signed demo and full packages per OS as artifacts (tar.gz to keep executable bits for SteamPipe).
# Signing/notarisation steps run only when their secrets exist, so forks and PRs still build unsigned.
name: build
on:
  workflow_dispatch:
    inputs:
      editions: { description: 'Editions (JSON array)', default: '["demo","full"]' }
      release: { description: 'Release build (RestartAppIfNecessary, no steam_appid.txt)', type: boolean, default: true }
  workflow_call:
    inputs:
      editions: { type: string, default: '["demo","full"]' }
      release: { type: boolean, default: true }
    secrets:
      AZURE_TENANT_ID: { required: false }
      AZURE_CLIENT_ID: { required: false }
      AZURE_CLIENT_SECRET: { required: false }
      AZURE_TRUSTED_SIGNING_ENDPOINT: { required: false }
      AZURE_CODE_SIGNING_ACCOUNT: { required: false }
      AZURE_CERT_PROFILE: { required: false }
      AZURE_PUBLISHER_NAME: { required: false }
      MAC_CERT_P12_BASE64: { required: false }
      MAC_CERT_PASSWORD: { required: false }
      APPLE_API_KEY_P8_BASE64: { required: false }
      APPLE_API_KEY_ID: { required: false }
      APPLE_API_ISSUER: { required: false }
      APPLE_TEAM_ID: { required: false }
      SENTRY_AUTH_TOKEN: { required: false }
      SENTRY_ORG: { required: false }
      SENTRY_PROJECT: { required: false }
      VITE_SENTRY_DSN: { required: false }
      SS_CRASH_SUBMIT_URL: { required: false }

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
        edition: ${{ fromJSON(inputs.editions) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SS_RELEASE: ${{ inputs.release && '1' || '' }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SS_CRASH_SUBMIT_URL: ${{ secrets.SS_CRASH_SUBMIT_URL }}
      HAS_AZURE: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/cache@v6
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Reproducible builds (PLT-0032): the commit time is the build date.
      - name: Source date epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: npm ci

      # ---- macOS signing identity + notarisation key (PLT-0035/0036/0037) ----
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.MAC_CERT_P12_BASE64 }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CERT_PASSWORD }}" >> "$GITHUB_ENV"
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      # ---- Windows: Azure Trusted Signing (PLT-0034/0037) ----
      - name: Azure Trusted Signing environment
        if: runner.os == 'Windows' && env.HAS_AZURE == 'true'
        shell: bash
        run: |
          {
            echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}"
            echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
            echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}"
            echo "AZURE_TRUSTED_SIGNING_ENDPOINT=${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}"
            echo "AZURE_CODE_SIGNING_ACCOUNT=${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}"
            echo "AZURE_CERT_PROFILE=${{ secrets.AZURE_CERT_PROFILE }}"
            echo "AZURE_PUBLISHER_NAME=${{ secrets.AZURE_PUBLISHER_NAME }}"
          } >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: node scripts/desktop.mjs pack --edition=${{ matrix.edition }} ${{ inputs.release && '--release' || '' }}

      - name: Locate package
        id: out
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) echo "dir=release/${{ matrix.edition }}/win-unpacked" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "dir=release/${{ matrix.edition }}/mac-universal" >> "$GITHUB_OUTPUT" ;;
            *)       echo "dir=release/${{ matrix.edition }}/linux-unpacked" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Inspect package (fuses, maps, size budget)
        shell: bash
        run: node scripts/check-package.mjs "${{ steps.out.outputs.dir }}" --max-mb=250

      # ---- Post-build signature verification: failure blocks upload (PLT-0038) ----
      - name: Verify Authenticode signatures
        if: runner.os == 'Windows' && env.HAS_AZURE == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem "${{ steps.out.outputs.dir }}" -Recurse -Include *.exe,*.dll,*.node | ForEach-Object {
            & $signtool.FullName verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "unsigned: $($_.FullName)" }
          }
      - name: Verify macOS signature, notarisation and Gatekeeper
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        shell: bash
        run: |
          APP=$(ls -d "${{ steps.out.outputs.dir }}"/*.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          find "$APP" \( -name '*.node' -o -name '*.dylib' \) -exec codesign --verify --strict --verbose=1 {} \;
          spctl -a -t exec -vv "$APP"
          xcrun stapler validate "$APP"

      # ---- Symbols and source maps to the crash backend (PLT-0123/0124); maps never ship ----
      - name: Upload symbols and source maps
        if: env.HAS_SENTRY == 'true' && runner.os == 'Linux'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./versions.json')['${{ matrix.edition }}']")
          RELEASE="suture-and-steel-${{ matrix.edition }}@${VERSION}+$(git rev-parse --short=8 HEAD).$(date -u -d @$SOURCE_DATE_EPOCH +%Y%m%d)"
          npx --yes @sentry/cli@2 releases new "$RELEASE"
          npx --yes @sentry/cli@2 sourcemaps upload --release "$RELEASE" --url-prefix 'app://game/' dist
          npx --yes @sentry/cli@2 debug-files upload --include-sources "${{ steps.out.outputs.dir }}"
      - name: Upload native symbols (Windows PDB / macOS dSYM)
        if: env.HAS_SENTRY == 'true' && runner.os != 'Linux'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        shell: bash
        run: npx --yes @sentry/cli@2 debug-files upload "${{ steps.out.outputs.dir }}"

      - name: Archive (preserves executable bits for SteamPipe, PLT-0025)
        shell: bash
        run: tar -czf "${{ matrix.edition }}-${{ runner.os }}.tar.gz" -C "$(dirname "${{ steps.out.outputs.dir }}")" "$(basename "${{ steps.out.outputs.dir }}")"
      - name: Archive hash (reproducibility check, PLT-0032)
        shell: bash
        run: |
          (cd "${{ steps.out.outputs.dir }}/.." && find "$(basename "${{ steps.out.outputs.dir }}")" -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256) > "${{ matrix.edition }}-${{ runner.os }}.sha256"
          tail -n 3 "${{ matrix.edition }}-${{ runner.os }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-${{ runner.os }}
          path: |
            ${{ matrix.edition }}-${{ runner.os }}.tar.gz
            ${{ matrix.edition }}-${{ runner.os }}.sha256
          retention-days: 90
