# Secret scanning on every PR and push (QAT-0008). Rules: .gitleaks.toml. Policy: docs/qa/secret-scanning.md.
name: QA secrets

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan the commits in this push / PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="${{ github.sha }}"
          fi
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE" --report-format sarif --report-path gitleaks.sarif .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
