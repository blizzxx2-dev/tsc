name: Feature request or suggestion
description: An idea, a missing option or an accessibility need.
labels: [feature-request]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is hard or missing today?
      description: Describe the situation in the game, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [Accessibility, Controls / input, Options, Difficulty / assists, Story / content, 'Platform (Steam or Deck)', Other]
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build you played (if any)
